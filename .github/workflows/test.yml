name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # No file larger than 1 MiB and no binary, but the amalgamation and the
  # images of assets/ (scripts/check-files.sh).
  files:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-files.sh

  test:
    name: test (${{ matrix.target.name }}, ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: linux/amd64, os: ubuntu-24.04 }
          - { name: linux/arm64, os: ubuntu-24.04-arm }
          - { name: darwin/arm64, os: macos-15 }
          # amd64 binaries on the arm64 runner, which Rosetta runs
          - { name: darwin/amd64, os: macos-15, goarch: amd64 }
          - { name: windows/amd64, os: windows-2025 }
        # The lowest Go the module supports (the go line of go.mod) and the
        # newest patch release of the newest minor version it supports.
        go: [go.mod, "1.27"]
    runs-on: ${{ matrix.target.os }}
    env:
      CGO_ENABLED: "0"
      # Empty: the runner's own architecture.
      GOARCH: ${{ matrix.target.goarch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go != 'go.mod' && matrix.go || '' }}
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}
          check-latest: ${{ matrix.go != 'go.mod' }}
      - run: go version
      # The sqlite3 shell, SQLite built from C, for TestInteropShell.
      - name: sqlite3 shell
        shell: bash
        run: |
          case "$RUNNER_OS" in
          Linux)
            command -v sqlite3 || { sudo apt-get update -q && sudo apt-get install -y -q sqlite3; }
            echo "SQLITE3=$(command -v sqlite3)" >> "$GITHUB_ENV" ;;
          macOS)
            echo "SQLITE3=/usr/bin/sqlite3" >> "$GITHUB_ENV" ;;
          Windows)
            # choco exits 0 when its feed does not answer and nothing was
            # installed, so the file is what says whether it worked.
            exe='C:\ProgramData\chocolatey\bin\sqlite3.exe'
            for try in 1 2 3 4; do
              choco install sqlite -y --no-progress || true
              if [ -f "$exe" ]; then break; fi
              sleep 30
            done
            if [ ! -f "$exe" ]; then
              echo "::error::choco did not install sqlite3.exe"
              exit 1
            fi
            echo "SQLITE3=$exe" >> "$GITHUB_ENV" ;;
          esac
      - run: go vet -asmdecl=false ./...
      # The cases of SQLite's fuzzcheck, for TestFuzzData.
      - uses: actions/cache@v4
        id: fuzzdata
        with:
          path: .build/fuzzdata
          key: fuzzdata-${{ hashFiles('scripts/fuzzdata.go', 'engine/vendor.sh') }}
      - run: go run scripts/fuzzdata.go
        if: steps.fuzzdata.outputs.cache-hit != 'true'
      # All the cases take five minutes or more on Windows, which makes and
      # deletes a file slowly: a quarter of them, another one each run.
      - name: fuzz cases on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: echo "FUZZDATA_SLICE=$((GITHUB_RUN_NUMBER % 4))/4" >> "$GITHUB_ENV"
      - run: go test -count=1 ./...
        env:
          FUZZDATA: ${{ github.workspace }}/.build/fuzzdata
          FUZZDATA_REQUIRED: "1"
      # A crash in TestFuzzData does not name its case: this file does.
      - name: fuzz case running
        if: failure()
        shell: bash
        run: cat .build/fuzzdata/running 2>/dev/null || true
      # The race detector needs cgo on linux. It tests the driver, not the build,
      # so the runner's own architecture is enough.
      - run: go test -race -count=1 . ./internal/vfs ./internal/csqlite
        if: runner.os != 'Windows' && matrix.target.goarch == ''
        env:
          CGO_ENABLED: "1"

  # The S3 client and the replicator against MinIO. MinIO no longer
  # publishes binaries or images, so it is built from the source of the
  # pinned release. Litestream restores the replica the tests write.
  s3:
    name: s3 (linux/amd64, MinIO)
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: "0"
      S3_TEST_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: MinIO
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/minio/minio@RELEASE.2025-09-07T16-13-09Z
          echo "MINIO=$RUNNER_TEMP/bin/minio" >> "$GITHUB_ENV"
      - name: Litestream
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/benbjohnson/litestream/cmd/litestream@v0.5.18
          echo "LITESTREAM=$RUNNER_TEMP/bin/litestream" >> "$GITHUB_ENV"
      - run: go test -count=1 -race ./replica/...
        env:
          CGO_ENABLED: "1"
