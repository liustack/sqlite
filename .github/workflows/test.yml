name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.target.name }}, ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: linux/amd64, os: ubuntu-24.04 }
          - { name: linux/arm64, os: ubuntu-24.04-arm }
          - { name: darwin/arm64, os: macos-15 }
          # amd64 binaries on the arm64 runner, which Rosetta runs
          - { name: darwin/amd64, os: macos-15, goarch: amd64 }
          - { name: windows/amd64, os: windows-2025 }
        # The lowest Go the module supports (the go line of go.mod) and the
        # newest patch release of the newest minor version it supports.
        go: [go.mod, "1.27"]
    runs-on: ${{ matrix.target.os }}
    env:
      CGO_ENABLED: "0"
      # Empty: the runner's own architecture.
      GOARCH: ${{ matrix.target.goarch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go != 'go.mod' && matrix.go || '' }}
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}
          check-latest: ${{ matrix.go != 'go.mod' }}
      - run: go version
      # The sqlite3 shell, SQLite built from C, for TestInteropShell.
      - name: sqlite3 shell
        shell: bash
        run: |
          case "$RUNNER_OS" in
          Linux)
            command -v sqlite3 || { sudo apt-get update -q && sudo apt-get install -y -q sqlite3; }
            echo "SQLITE3=$(command -v sqlite3)" >> "$GITHUB_ENV" ;;
          macOS)
            echo "SQLITE3=/usr/bin/sqlite3" >> "$GITHUB_ENV" ;;
          Windows)
            choco install sqlite -y --no-progress
            echo 'SQLITE3=C:\ProgramData\chocolatey\bin\sqlite3.exe' >> "$GITHUB_ENV" ;;
          esac
      - run: go vet -asmdecl=false ./...
      - run: go test -count=1 ./...
      # The race detector needs cgo on linux. It tests the driver, not the build,
      # so the runner's own architecture is enough.
      - run: go test -race -count=1 . ./internal/vfs ./internal/csqlite
        if: runner.os != 'Windows' && matrix.target.goarch == ''
        env:
          CGO_ENABLED: "1"
